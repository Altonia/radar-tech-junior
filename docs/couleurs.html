<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M13 · choix des couleurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
  :root { --bg: #080a12; --fg: #f1f4fb; --fg-2: #b4bfd6; --fg-3: #7f8baa; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Geist", system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; display: grid; gap: 24px; }
  .intro h1 { font: 800 28px "Syne", sans-serif; margin: 0 0 6px; }
  .intro p { color: var(--fg-2); margin: 0; }
  /* chaque palette redéfinit les mêmes variables */
  .pal { --panel: #121a2c; --panel-2: #18223a; --line: #26314d;
    position: relative; overflow: hidden; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-p, #0a0d16); padding: 26px; display: grid; gap: 18px; }
  .pal::after { content: ""; position: absolute; width: 700px; height: 360px; left: -140px; top: -200px; pointer-events: none;
    background: radial-gradient(closest-side at 30% 50%, var(--h1), transparent), radial-gradient(closest-side at 72% 55%, var(--h2), transparent); filter: blur(12px); }
  .pal > * { position: relative; z-index: 1; }
  .head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .num { font: 600 13px "Geist", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .num b { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-right: 8px; border-radius: 8px; background: var(--grad); color: var(--on-grad); font-size: 15px; }
  .why { color: var(--fg-3); font-size: 13.5px; }
  .title { margin: 0; font: 800 clamp(60px, 11vw, 112px)/.9 "Syne", sans-serif; letter-spacing: -.05em;
    background: var(--title-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .excel { padding: 11px 20px; border-radius: 999px; font: 700 14.5px "Syne", sans-serif; background: var(--grad); color: var(--on-grad); box-shadow: 0 10px 28px -12px var(--a1); }
  .tab { padding: 7px 14px; border-radius: 999px; font: 700 14px "Syne", sans-serif; color: var(--fg); background: linear-gradient(var(--panel-2), var(--panel-2)) padding-box, var(--grad) border-box; border: 1.5px solid transparent; }
  .chip { padding: 6px 12px; border-radius: 999px; font: 500 13px "Geist", sans-serif; border: 1px solid #34426a; color: var(--fg-2); }
  .chip.on { background: var(--grad); color: var(--on-grad); border-color: transparent; }
  .card { display: grid; grid-template-columns: 54px 1fr auto; gap: 6px 16px; align-items: center; padding: 16px 18px; border-radius: 16px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel)) padding-box, var(--grad) border-box; border: 1px solid transparent; box-shadow: 0 18px 40px -20px var(--a1); }
  .score { grid-row: span 2; width: 54px; height: 54px; border-radius: 50%; position: relative; background: conic-gradient(from 210deg, var(--a1) 0, var(--a2) 40%, var(--a3) 64%, var(--line) 0); }
  .score::after { content: "64"; position: absolute; inset: 4px; border-radius: 50%; background: #0d1120; display: grid; place-items: center; font: 600 15px "Geist Mono", monospace; }
  .name { font: 700 19px "Syne", sans-serif; }
  .tags { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; color: color-mix(in srgb, var(--c) 85%, #fff); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .btns { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 8px; }
  .b { padding: 7px 14px; border-radius: 999px; font: 700 13.5px "Syne", sans-serif; color: color-mix(in srgb, var(--c) 75%, #fff);
    background: color-mix(in srgb, var(--c) 18%, var(--panel)); border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent); }
  .t1 { --c: var(--a1); } .t2 { --c: var(--a2); } .t3 { --c: var(--a3); }
  @media (max-width: 700px) { .card { grid-template-columns: 54px 1fr; } .btns { grid-row: auto; grid-column: 1 / -1; } }

  /* 0 — actuelle, pour comparer */
  .p0 { --a1: #4f8cff; --a2: #a78bfa; --a3: #f472b6; --grad: linear-gradient(120deg, #4f8cff, #a78bfa 50%, #f472b6); --on-grad: #fff;
    --title-grad: linear-gradient(95deg, #fff, #cdd9ff 30%, #7aa7ff 55%, #a78bfa 78%, #f472b6); --h1: rgba(79,140,255,.35); --h2: rgba(167,139,250,.28); }
  /* 1 — Or d'Hercule : les vieilles étoiles dorées de M13 */
  .p1 { --bg-p: #0b0a08; --panel: #17140f; --panel-2: #1f1a12; --line: #3a3020;
    --a1: #f5c451; --a2: #ff9a3c; --a3: #2dd4bf; --grad: linear-gradient(120deg, #ffe08a, #f5c451 40%, #ff9a3c); --on-grad: #1a1204;
    --title-grad: linear-gradient(95deg, #fff7e0, #ffe08a 35%, #f5c451 60%, #ff9a3c); --h1: rgba(245,196,81,.30); --h2: rgba(255,154,60,.22); }
  /* 2 — Aurore boréale : vert émeraude, cyan et un peu de lime */
  .p2 { --bg-p: #06100e; --panel: #0e1c19; --panel-2: #12251f; --line: #1f3a33;
    --a1: #34d399; --a2: #22d3ee; --a3: #bef264; --grad: linear-gradient(120deg, #bef264, #34d399 45%, #22d3ee); --on-grad: #04140f;
    --title-grad: linear-gradient(95deg, #ecfeff, #bef264 30%, #34d399 60%, #22d3ee); --h1: rgba(52,211,153,.28); --h2: rgba(34,211,238,.22); }
  /* 3 — Braise : rouge course, orange et or */
  .p3 { --bg-p: #0d0707; --panel: #1a0f0f; --panel-2: #221313; --line: #3f2020;
    --a1: #ff3b47; --a2: #ff7a1a; --a3: #ffc53d; --grad: linear-gradient(120deg, #ff2d55, #ff5a1f 50%, #ffb020); --on-grad: #fff;
    --title-grad: linear-gradient(95deg, #fff1ec, #ffb4a0 30%, #ff5a3c 60%, #ffb020); --h1: rgba(255,59,71,.30); --h2: rgba(255,122,26,.22); }
  /* 4 — Glacier : bleu glacier, argent et vert électrique */
  .p4 { --bg-p: #070b10; --panel: #0f1720; --panel-2: #142030; --line: #233446;
    --a1: #7dd3fc; --a2: #e2e8f0; --a3: #a3e635; --grad: linear-gradient(120deg, #e0f2fe, #7dd3fc 50%, #38bdf8); --on-grad: #04121c;
    --title-grad: linear-gradient(95deg, #ffffff, #e0f2fe 35%, #7dd3fc 65%, #38bdf8); --h1: rgba(125,211,252,.26); --h2: rgba(163,230,53,.12); }
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <h1>Choisis les couleurs de M13</h1>
    <p>Chaque bloc montre le titre, un onglet, des filtres, une carte avec ses boutons et le bouton Excel. Le 0, c'est l'actuel, pour comparer. Dis juste le numéro.</p>
  </div>
  <div id="list" style="display:grid;gap:24px"></div>
</div>
<template id="tpl">
  <section class="pal">
    <div class="head"><span class="num"><b></b><span class="pname"></span></span><span class="why"></span></div>
    <p class="title">M13</p>
    <div class="row"><span class="tab">Les boîtes 12 950</span><span class="chip on">Bretagne 981</span><span class="chip">Pays de la Loire 1 482</span><span class="excel">Tout en Excel</span></div>
    <div class="card"><span class="score"></span><span class="name">Vital Ingenierie</span>
      <div class="btns"><span class="b t1">Site</span><span class="b t2">Contact</span></div>
      <div class="tags"><span class="tag t1">ESN / Conseil IT</span><span class="tag t2">Prend des alternants</span><span class="tag t3">Recrute</span></div></div>
  </section>
</template>
<script>
  const P = [["Actuelle", "Bleu, violet, rose"], ["Or d'Hercule", "Les vieilles étoiles dorées de M13, avec une touche de turquoise"],
    ["Aurore boréale", "Émeraude, cyan et vert lime"], ["Braise", "Rouge course, orange et or"], ["Glacier", "Bleu glacier, argent et vert électrique"]];
  const tpl = document.getElementById("tpl"), list = document.getElementById("list");
  P.forEach(([n, w], i) => {
    const el = tpl.content.firstElementChild.cloneNode(true);
    el.classList.add("p" + i); el.querySelector(".num b").textContent = i; el.querySelector(".pname").textContent = n; el.querySelector(".why").textContent = w;
    list.append(el);
  });
</script>
</body>
</html>
