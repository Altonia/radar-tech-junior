<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Tech Junior</title>
<meta name="description" content="Entreprises du numérique et offres junior ou alternance pour des profils Bac+5, en Île-de-France, Pays de la Loire et Bretagne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e3fb4'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
</head>
<body>
<header class="masthead">
  <div class="masthead-in">
    <div class="brand">
      <span class="wordmark">Radar Tech Junior</span>
      <span class="brand-sub" id="maj">Île-de-France · Pays de la Loire · Bretagne</span>
    </div>
    <div class="account" id="account"></div>
  </div>
  <nav class="views" role="tablist" aria-label="Vue">
    <button role="tab" class="view" data-view="ent" aria-selected="true"><span>Entreprises</span><b id="n-ent"></b></button>
    <button role="tab" class="view" data-view="off" aria-selected="false"><span>Offres</span><b id="n-off"></b></button>
    <button role="tab" class="view" data-view="suivi" aria-selected="false"><span>Mon suivi</span><b id="n-suivi"></b></button>
  </nav>
</header>

<div class="layout">
  <aside class="side" id="side" aria-label="Filtres">
    <div class="side-head">
      <span>Filtres</span>
      <button class="link" id="clear" hidden>Tout effacer</button>
      <button class="icon-btn close-side" id="close-side" aria-label="Fermer les filtres">×</button>
    </div>
    <label class="search">
      <span class="sr">Rechercher</span>
      <input type="search" id="q" autocomplete="off">
    </label>
    <div id="facets"></div>
    <a class="excel" href="radar-tech-junior.xlsx" download>Télécharger tout en Excel</a>
    <button class="btn primary only-mobile see-results" id="see-results">Voir les résultats</button>
  </aside>

  <main class="results">
    <div class="intro" id="intro"></div>
    <div class="toolbar">
      <button class="btn only-mobile" id="open-side">Filtres <b id="n-filters"></b></button>
      <span class="count" id="count"></span>
      <select id="tri" aria-label="Trier"></select>
    </div>
    <ol class="rows" id="rows"><li class="state">Chargement des données…</li></ol>
    <button class="btn more" id="more" hidden></button>
    <footer class="foot" id="foot"></footer>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Détail" hidden>
  <button class="icon-btn close-drawer" id="close-drawer" aria-label="Fermer">×</button>
  <div id="detail"></div>
</aside>

<dialog class="login" id="login">
  <form method="dialog" id="login-form">
    <h2>Retrouver mon suivi partout</h2>
    <p>Entrez votre email : vous recevrez un lien de connexion. Pas de mot de passe. Votre suivi est privé, personne d'autre ne le voit.</p>
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email" placeholder="prenom@exemple.fr">
    <p class="msg" id="login-msg" role="status"></p>
    <div class="login-actions">
      <button type="button" class="btn" id="login-cancel">Annuler</button>
      <button type="submit" class="btn primary" id="login-send">Recevoir le lien</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
