<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Filon · choix de la police</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Archivo:wdth,wght@62..125,500..900&family=Syne:wght@600;700;800&family=Big+Shoulders+Display:wght@700;800;900&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Oxanium:wght@600;700;800&family=Geist:wght@400;500;600&display=swap">
<style>
  :root { --bg: #080a12; --panel: #141b2e; --panel-2: #1a2340; --line: #26314d; --fg: #f1f4fb; --fg-2: #b4bfd6; --fg-3: #7f8baa;
    --blue: #4f8cff; --violet: #a78bfa; --pink: #f472b6; --amber: #fbbf24; --go: #34d399; --grad: linear-gradient(120deg, #4f8cff, #a78bfa 50%, #f472b6); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Geist", system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; display: grid; gap: 22px; }
  .intro h1 { font: 600 26px "Geist", sans-serif; margin: 0 0 6px; }
  .intro p { color: var(--fg-2); margin: 0; }
  .opt { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 18px; padding: 26px 26px 24px; display: grid; gap: 18px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .num { font: 600 13px "Geist", sans-serif; color: var(--fg-3); letter-spacing: .08em; text-transform: uppercase; }
  .num b { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-right: 8px; border-radius: 8px; background: var(--grad); color: #fff; font-size: 15px; letter-spacing: 0; }
  .why { color: var(--fg-3); font-size: 13.5px; }
  .title { margin: 0; line-height: .95; background: linear-gradient(95deg, #fff, #cdd9ff 30%, #7aa7ff 55%, #a78bfa 78%, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { display: flex; justify-content: space-between; align-items: center; gap: 14px 20px; flex-wrap: wrap; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .name { margin: 0 0 4px; color: var(--fg); }
  .meta { color: var(--fg-2); font-size: 14px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .b { --c: var(--blue); display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 999px; cursor: pointer; border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent);
    background: color-mix(in srgb, var(--c) 18%, var(--panel)); color: color-mix(in srgb, var(--c) 75%, #fff); transition: transform .15s, box-shadow .15s; }
  .b:hover { transform: translateY(-1px); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent), 0 8px 22px -8px var(--c); color: #fff; }
  .b.x { --c: var(--pink); background: var(--grad); border-color: transparent; color: #fff; }
  .amber { --c: var(--amber); } .violet { --c: var(--violet); }

  /* 1 — Michroma : large et technique, esprit automobile */
  .f1 .title { font: 400 clamp(40px, 7vw, 76px) "Michroma", sans-serif; letter-spacing: -.02em; }
  .f1 .name { font: 400 18px "Michroma", sans-serif; letter-spacing: -.01em; }
  .f1 .b { font: 400 11px "Michroma", sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  /* 2 — Archivo étendu : imposant, net, très lisible */
  .f2 .title { font: 900 clamp(48px, 9vw, 96px) "Archivo", sans-serif; font-stretch: 125%; letter-spacing: -.04em; }
  .f2 .name { font: 800 20px "Archivo", sans-serif; font-stretch: 112%; letter-spacing: -.02em; }
  .f2 .b { font: 700 13px "Archivo", sans-serif; font-stretch: 118%; letter-spacing: .04em; text-transform: uppercase; }
  /* 3 — Syne : moderne et artistique, beaucoup de caractère */
  .f3 .title { font: 800 clamp(50px, 9vw, 100px) "Syne", sans-serif; letter-spacing: -.04em; }
  .f3 .name { font: 700 21px "Syne", sans-serif; letter-spacing: -.01em; }
  .f3 .b { font: 700 13.5px "Syne", sans-serif; letter-spacing: .02em; }
  /* 4 — Big Shoulders : condensée et massive, esprit industriel */
  .f4 .title { font: 900 clamp(60px, 11vw, 124px) "Big Shoulders Display", sans-serif; letter-spacing: .005em; text-transform: uppercase; }
  .f4 .name { font: 800 24px "Big Shoulders Display", sans-serif; letter-spacing: .02em; }
  .f4 .b { font: 800 15px "Big Shoulders Display", sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  /* 5 — Bricolage Grotesque condensée : chaleureuse et affirmée */
  .f5 .title { font: 800 clamp(52px, 9.5vw, 104px) "Bricolage Grotesque", sans-serif; font-stretch: 78%; letter-spacing: -.035em; }
  .f5 .name { font: 700 22px "Bricolage Grotesque", sans-serif; font-stretch: 85%; letter-spacing: -.01em; }
  .f5 .b { font: 700 14px "Bricolage Grotesque", sans-serif; font-stretch: 90%; letter-spacing: .01em; }
  /* 6 — Oxanium : tech carrée, lisible, un peu futuriste */
  .f6 .title { font: 800 clamp(50px, 9vw, 98px) "Oxanium", sans-serif; letter-spacing: -.03em; }
  .f6 .name { font: 700 20px "Oxanium", sans-serif; }
  .f6 .b { font: 700 13px "Oxanium", sans-serif; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <h1>Choisis la police du Filon</h1>
    <p>Chaque bloc montre le titre, une carte de boîte et ses boutons avec une police différente. Passe la souris sur les boutons. Dis juste le numéro.</p>
  </div>
  <template id="tpl">
    <section class="opt">
      <div class="head"><span class="num"><b></b><span class="fname"></span></span><span class="why"></span></div>
      <p class="title">Le Filon</p>
      <div class="card">
        <div><p class="name">Vital Ingenierie</p><div class="meta">La Garenne-Colombes (92) · 10-19 salariés</div></div>
        <div class="btns"><span class="b">Site</span><span class="b amber">Alternance</span><span class="b violet">Contact</span><span class="b x">Tout en Excel</span></div>
      </div>
    </section>
  </template>
  <div id="list"></div>
</div>
<script>
  const OPTS = [
    ["Michroma", "Large et technique, esprit automobile"],
    ["Archivo étendu", "Imposant, net, très lisible"],
    ["Syne", "Moderne et artistique, beaucoup de caractère"],
    ["Big Shoulders", "Condensée et massive, esprit industriel"],
    ["Bricolage condensée", "Chaleureuse et affirmée"],
    ["Oxanium", "Tech carrée, un peu futuriste"],
  ];
  const tpl = document.getElementById("tpl"), list = document.getElementById("list");
  list.style.cssText = "display:grid;gap:22px";
  OPTS.forEach(([n, w], i) => {
    const el = tpl.content.firstElementChild.cloneNode(true);
    el.classList.add("f" + (i + 1));
    el.querySelector(".num b").textContent = i + 1;
    el.querySelector(".fname").textContent = n;
    el.querySelector(".why").textContent = w;
    list.append(el);
  });
</script>
</body>
</html>
